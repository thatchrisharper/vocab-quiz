<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US States & Capitals Quiz</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg);
        }

        h1 { text-align: center; color: #1e293b; margin-bottom: 5px; }
        
        /* Map Container */
        #map-container {
            width: 100%;
            height: 0;
            padding-bottom: 60%; /* Aspect Ratio for US Map */
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 30px;
            position: relative; 
            border: 2px solid #e2e8f0;
            overflow: hidden;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .state {
            fill: #e2e8f0;
            stroke: white;
            stroke-width: 1px;
            transition: fill 0.2s;
        }

        /* Active state (when input is focused) */
        .state.active { 
            fill: var(--primary); 
            stroke: #1e40af;
            stroke-width: 2px;
            filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.5));
        }
        
        .state.correct { fill: var(--success); }
        .state.incorrect { fill: var(--error); }

        .state-label {
            font-size: 14px; /* Larger font for readability */
            font-weight: 900;
            fill: #334155;
            pointer-events: none;
            text-anchor: middle;
            alignment-baseline: middle;
        }
        
        .state-label.active { fill: white; }

        /* Quiz Form */
        #quiz-form {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .question-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Highlight the card when typing */
        .question-card:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .number-badge {
            background: #1e293b;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        input {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            width: 100%;
            font-size: 14px;
            box-sizing: border-box; 
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input.correct { border-color: var(--success); background-color: #f0fdf4; }
        input.incorrect { border-color: var(--error); background-color: #fef2f2; }

        .answer-key {
            font-size: 12px;
            color: var(--error);
            display: none;
            margin-top: 4px;
        }
        .show-key .answer-key { display: block; }

        #controls {
            text-align: center;
            margin: 40px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #1d4ed8; }
        button#reset { background-color: #64748b; }

    </style>
</head>
<body>

    <h1>🇺🇸 50 States & Capitals Challenge</h1>
    <p style="text-align: center; color: #64748b; margin-bottom: 20px;">
        Click an input box to see where that state is on the map!
    </p>

    <div id="map-container"></div>

    <div id="quiz-form"></div>

    <div id="controls">
        <button onclick="checkAnswers()">Check Answers</button>
        <button id="reset" onclick="location.reload()">New Quiz</button>
    </div>

    <script>
        // Full Data for 50 States
        const statesData = [
            { name: "Alabama", capital: "Montgomery" },
            { name: "Alaska", capital: "Juneau" },
            { name: "Arizona", capital: "Phoenix" },
            { name: "Arkansas", capital: "Little Rock" },
            { name: "California", capital: "Sacramento" },
            { name: "Colorado", capital: "Denver" },
            { name: "Connecticut", capital: "Hartford" },
            { name: "Delaware", capital: "Dover" },
            { name: "Florida", capital: "Tallahassee" },
            { name: "Georgia", capital: "Atlanta" },
            { name: "Hawaii", capital: "Honolulu" },
            { name: "Idaho", capital: "Boise" },
            { name: "Illinois", capital: "Springfield" },
            { name: "Indiana", capital: "Indianapolis" },
            { name: "Iowa", capital: "Des Moines" },
            { name: "Kansas", capital: "Topeka" },
            { name: "Kentucky", capital: "Frankfort" },
            { name: "Louisiana", capital: "Baton Rouge" },
            { name: "Maine", capital: "Augusta" },
            { name: "Maryland", capital: "Annapolis" },
            { name: "Massachusetts", capital: "Boston" },
            { name: "Michigan", capital: "Lansing" },
            { name: "Minnesota", capital: "Saint Paul" },
            { name: "Mississippi", capital: "Jackson" },
            { name: "Missouri", capital: "Jefferson City" },
            { name: "Montana", capital: "Helena" },
            { name: "Nebraska", capital: "Lincoln" },
            { name: "Nevada", capital: "Carson City" },
            { name: "New Hampshire", capital: "Concord" },
            { name: "New Jersey", capital: "Trenton" },
            { name: "New Mexico", capital: "Santa Fe" },
            { name: "New York", capital: "Albany" },
            { name: "North Carolina", capital: "Raleigh" },
            { name: "North Dakota", capital: "Bismarck" },
            { name: "Ohio", capital: "Columbus" },
            { name: "Oklahoma", capital: "Oklahoma City" },
            { name: "Oregon", capital: "Salem" },
            { name: "Pennsylvania", capital: "Harrisburg" },
            { name: "Rhode Island", capital: "Providence" },
            { name: "South Carolina", capital: "Columbia" },
            { name: "South Dakota", capital: "Pierre" },
            { name: "Tennessee", capital: "Nashville" },
            { name: "Texas", capital: "Austin" },
            { name: "Utah", capital: "Salt Lake City" },
            { name: "Vermont", capital: "Montpelier" },
            { name: "Virginia", capital: "Richmond" },
            { name: "Washington", capital: "Olympia" },
            { name: "West Virginia", capital: "Charleston" },
            { name: "Wisconsin", capital: "Madison" },
            { name: "Wyoming", capital: "Cheyenne" }
        ];

        // Shuffle function
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let quizData = [];

        // Initialize Map and Quiz
        async function init() {
            // 1. Setup Quiz Data
            const shuffledStates = shuffle([...statesData]);
            
            // Map names to quiz numbers and clean names for IDs
            quizData = shuffledStates.map((state, index) => ({
                ...state,
                quizNumber: index + 1,
                cleanName: state.name.replace(/\s+/g, '') // remove spaces for IDs e.g. "NewYork"
            }));

            // 2. Render Forms
            const formContainer = document.getElementById('quiz-form');
            // Sort by quiz number so list is 1, 2, 3...
            quizData.sort((a,b) => a.quizNumber - b.quizNumber).forEach(item => {
                const div = document.createElement('div');
                div.className = 'question-card';
                div.id = `card-${item.cleanName}`;
                div.innerHTML = `
                    <div class="number-badge">${item.quizNumber}</div>
                    <div class="inputs">
                        <input type="text" placeholder="State" id="input-state-${item.cleanName}" onfocus="highlightState('${item.cleanName}')">
                        <input type="text" placeholder="Capital" id="input-cap-${item.cleanName}" onfocus="highlightState('${item.cleanName}')">
                        <div class="answer-key">Correct: <b>${item.name}</b>, <b>${item.capital}</b></div>
                    </div>
                `;
                formContainer.appendChild(div);
            });

            // 3. Render Map
            const svg = d3.select("#map-container").append("svg")
                .attr("viewBox", `0 0 1000 600`);

            try {
                // Fetch GeoJSON (Standard Lat/Lon data)
                const response = await fetch("https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json");
                const json = await response.json();

                // Auto-scale projection to fit the SVG box
                const projection = d3.geoAlbersUsa()
                    .fitSize([1000, 600], json); 

                const path = d3.geoPath().projection(projection);

                const g = svg.append("g");

                // Draw States (Removed click events, purely visual now)
                g.selectAll("path")
                    .data(json.features)
                    .enter().append("path")
                    .attr("d", path)
                    .attr("class", "state")
                    .attr("id", d => {
                        const name = d.properties.name.replace(/\s+/g, '');
                        return `state-${name}`;
                    });

                // Add Numbers
                g.selectAll("text")
                    .data(json.features)
                    .enter().append("text")
                    .attr("class", "state-label")
                    .attr("transform", d => {
                        const centroid = path.centroid(d);
                        if (!centroid[0]) return "translate(-100,-100)"; 
                        return `translate(${centroid[0]},${centroid[1]})`;
                    })
                    .attr("id", d => `label-${d.properties.name.replace(/\s+/g, '')}`)
                    .text(d => {
                        const match = quizData.find(q => q.name === d.properties.name);
                        return match ? match.quizNumber : "";
                    });

            } catch (error) {
                document.getElementById('map-container').innerHTML = `<p style="padding:20px; color:red">Error loading map: ${error.message}</p>`;
            }
        }

        // Interaction Logic - One way only (Input -> Map)
        function highlightState(name) {
            // Clear previous active states
            d3.selectAll(".state").classed("active", false);
            d3.selectAll(".state-label").classed("active", false);

            // Activate new state on map
            d3.select(`#state-${name}`).classed("active", true);
            d3.select(`#label-${name}`).classed("active", true);
        }

        // Validation
        function checkAnswers() {
            let score = 0;
            
            quizData.forEach(item => {
                const stateInput = document.getElementById(`input-state-${item.cleanName}`);
                const capInput = document.getElementById(`input-cap-${item.cleanName}`);
                const card = document.getElementById(`card-${item.cleanName}`);
                const statePath = d3.select(`#state-${item.cleanName}`);

                if(!stateInput) return; 

                const stateCorrect = stateInput.value.trim().toLowerCase() === item.name.toLowerCase();
                const capCorrect = capInput.value.trim().toLowerCase() === item.capital.toLowerCase();

                // Style Inputs
                stateInput.className = stateCorrect ? 'correct' : 'incorrect';
                capInput.className = capCorrect ? 'correct' : 'incorrect';

                // Style Map & Score
                if (stateCorrect && capCorrect) {
                    statePath.classed("correct", true).classed("incorrect", false);
                    score++;
                } else {
                    statePath.classed("incorrect", true).classed("correct", false);
                    card.classList.add("show-key");
                }
            });

            // Scroll to top to see map results
            window.scrollTo({ top: 0, behavior: 'smooth' });
            alert(`You got ${score} out of 50 correct!`);
        }

        init();
    </script>
</body>
</html>
