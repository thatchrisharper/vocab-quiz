<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>US States & Capitals Quiz</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --bg: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg);
            /* Disables pull-to-refresh and zoom on iPad for an app-like feel */
            touch-action: manipulation; 
            overscroll-behavior: none;
        }

        h1 { text-align: center; color: #1e293b; margin-bottom: 5px; }
        
        /* Map Container */
        #map-wrapper {
            position: relative;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 30px;
            border: 2px solid #e2e8f0;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .state {
            fill: #e2e8f0;
            stroke: white;
            stroke-width: 1px;
            stroke-linejoin: round;
            transition: fill 0.2s;
        }

        .state.active { 
            fill: var(--primary); 
            stroke: #1e40af;
        }
        
        .state.correct { fill: var(--success); }
        .state.partial { fill: var(--warning); }
        .state.incorrect { fill: var(--error); }

        .state-label {
            font-size: 12px;
            font-weight: 700;
            fill: #334155;
            pointer-events: none;
            text-anchor: middle;
            alignment-baseline: middle;
            font-family: sans-serif;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
        }
        
        .state-label.active { fill: white; text-shadow: none; }

        /* Quiz Form */
        #quiz-form {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .question-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-card:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .number-badge {
            background: #1e293b;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        input {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            width: 100%;
            font-size: 16px; /* Prevents auto-zoom on iPad */
            -webkit-appearance: none;
            background-color: white;
        }

        input:focus { outline: none; border-color: var(--primary); }
        
        input.correct { border-color: var(--success); background-color: #f0fdf4; }
        input.partial { border-color: var(--warning); background-color: #fffbeb; }
        input.incorrect { border-color: var(--error); background-color: #fef2f2; }

        .answer-key {
            font-size: 12px;
            color: #64748b;
            display: none;
            margin-top: 4px;
        }
        .show-key .answer-key { display: block; }
        .answer-key b { color: #0f172a; }

        #controls {
            text-align: center;
            margin: 40px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #score-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>

    <h1>🇺🇸 50 States & Capitals</h1>
    <p style="text-align: center; color: #64748b; margin-bottom: 20px;">
        100 Points Total. Misspellings lose 0.5 points.
    </p>

    <div id="score-display"></div>

    <div id="map-wrapper">
        <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#64748b;" id="loading-msg">Loading Map...</div>
    </div>

    <div id="quiz-form"></div>

    <div id="controls">
        <button onclick="checkAnswers()">Check Answers</button>
        <button id="reset" onclick="location.reload()" style="background-color: #64748b;">New Quiz</button>
    </div>

    <script>
        const statesData = [
            { id: "01", name: "Alabama", capital: "Montgomery" },
            { id: "02", name: "Alaska", capital: "Juneau" },
            { id: "04", name: "Arizona", capital: "Phoenix" },
            { id: "05", name: "Arkansas", capital: "Little Rock" },
            { id: "06", name: "California", capital: "Sacramento" },
            { id: "08", name: "Colorado", capital: "Denver" },
            { id: "09", name: "Connecticut", capital: "Hartford" },
            { id: "10", name: "Delaware", capital: "Dover" },
            { id: "12", name: "Florida", capital: "Tallahassee" },
            { id: "13", name: "Georgia", capital: "Atlanta" },
            { id: "15", name: "Hawaii", capital: "Honolulu" },
            { id: "16", name: "Idaho", capital: "Boise" },
            { id: "17", name: "Illinois", capital: "Springfield" },
            { id: "18", name: "Indiana", capital: "Indianapolis" },
            { id: "19", name: "Iowa", capital: "Des Moines" },
            { id: "20", name: "Kansas", capital: "Topeka" },
            { id: "21", name: "Kentucky", capital: "Frankfort" },
            { id: "22", name: "Louisiana", capital: "Baton Rouge" },
            { id: "23", name: "Maine", capital: "Augusta" },
            { id: "24", name: "Maryland", capital: "Annapolis" },
            { id: "25", name: "Massachusetts", capital: "Boston" },
            { id: "26", name: "Michigan", capital: "Lansing" },
            { id: "27", name: "Minnesota", capital: "Saint Paul" },
            { id: "28", name: "Mississippi", capital: "Jackson" },
            { id: "29", name: "Missouri", capital: "Jefferson City" },
            { id: "30", name: "Montana", capital: "Helena" },
            { id: "31", name: "Nebraska", capital: "Lincoln" },
            { id: "32", name: "Nevada", capital: "Carson City" },
            { id: "33", name: "New Hampshire", capital: "Concord" },
            { id: "34", name: "New Jersey", capital: "Trenton" },
            { id: "35", name: "New Mexico", capital: "Santa Fe" },
            { id: "36", name: "New York", capital: "Albany" },
            { id: "37", name: "North Carolina", capital: "Raleigh" },
            { id: "38", name: "North Dakota", capital: "Bismarck" },
            { id: "39", name: "Ohio", capital: "Columbus" },
            { id: "40", name: "Oklahoma", capital: "Oklahoma City" },
            { id: "41", name: "Oregon", capital: "Salem" },
            { id: "42", name: "Pennsylvania", capital: "Harrisburg" },
            { id: "44", name: "Rhode Island", capital: "Providence" },
            { id: "45", name: "South Carolina", capital: "Columbia" },
            { id: "46", name: "South Dakota", capital: "Pierre" },
            { id: "47", name: "Tennessee", capital: "Nashville" },
            { id: "48", name: "Texas", capital: "Austin" },
            { id: "49", name: "Utah", capital: "Salt Lake City" },
            { id: "50", name: "Vermont", capital: "Montpelier" },
            { id: "51", name: "Virginia", capital: "Richmond" },
            { id: "53", name: "Washington", capital: "Olympia" },
            { id: "54", name: "West Virginia", capital: "Charleston" },
            { id: "55", name: "Wisconsin", capital: "Madison" },
            { id: "56", name: "Wyoming", capital: "Cheyenne" }
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function getEditDistance(a, b) {
            if(a.length === 0) return b.length; 
            if(b.length === 0) return a.length; 
            var matrix = [];
            for(var i = 0; i <= b.length; i++){ matrix[i] = [i]; }
            for(var j = 0; j <= a.length; j++){ matrix[0][j] = j; }
            for(var i = 1; i <= b.length; i++){
                for(var j = 1; j <= a.length; j++){
                    if(b.charAt(i-1) == a.charAt(j-1)){
                        matrix[i][j] = matrix[i-1][j-1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i-1][j-1] + 1, matrix[i][j-1] + 1, matrix[i-1][j] + 1);
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        let quizData = [];

        async function init() {
            quizData = shuffle([...statesData]).map((state, index) => ({
                ...state,
                quizNumber: index + 1
            }));

            const formContainer = document.getElementById('quiz-form');
            quizData.sort((a,b) => a.quizNumber - b.quizNumber).forEach(item => {
                const div = document.createElement('div');
                div.className = 'question-card';
                div.id = `card-${item.id}`;
                // ADDED: autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                div.innerHTML = `
                    <div class="number-badge">${item.quizNumber}</div>
                    <div class="inputs">
                        <input type="text" placeholder="State" id="input-state-${item.id}" 
                               onfocus="highlightState('${item.id}')"
                               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        <input type="text" placeholder="Capital" id="input-cap-${item.id}" 
                               onfocus="highlightState('${item.id}')"
                               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                        <div class="answer-key">Correct: <b>${item.name}</b>, <b>${item.capital}</b></div>
                    </div>
                `;
                formContainer.appendChild(div);
            });

            const svg = d3.select("#map-wrapper").append("svg")
                .attr("viewBox", "0 0 975 610")
                .attr("preserveAspectRatio", "xMidYMid meet");

            try {
                const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json");
                document.getElementById('loading-msg').style.display = 'none';
                const path = d3.geoPath(null);
                const g = svg.append("g");

                g.selectAll("path")
                    .data(topojson.feature(us, us.objects.states).features)
                    .enter().append("path")
                    .attr("d", path)
                    .attr("class", "state")
                    .attr("id", d => `state-${d.id}`);

                g.selectAll("text")
                    .data(topojson.feature(us, us.objects.states).features)
                    .enter().append("text")
                    .attr("class", "state-label")
                    .attr("transform", d => {
                        const centroid = path.centroid(d);
                        if (!centroid[0]) return "translate(-100,-100)"; 
                        let [x, y] = centroid;
                        const id = d.id;
                        if (id === "10") { x += 22; y += 4; } 
                        if (id === "44") { x += 12; y += 12; } 
                        if (id === "11") { y += 15; } 
                        if (id === "24") { x += 10; y -= 10; } 
                        if (id === "34") { x += 15; } 
                        return `translate(${x},${y})`;
                    })
                    .attr("id", d => `label-${d.id}`)
                    .text(d => {
                        const match = quizData.find(q => q.id === d.id);
                        return match ? match.quizNumber : "";
                    });

            } catch (error) {
                document.getElementById('loading-msg').innerHTML = "Error loading map.";
            }
        }

        function highlightState(id) {
            d3.selectAll(".state").classed("active", false);
            d3.selectAll(".state-label").classed("active", false);
            d3.select(`#state-${id}`).classed("active", true);
            d3.select(`#label-${id}`).classed("active", true);
        }

        function gradeInput(inputVal, correctVal) {
            const val = inputVal.trim().toLowerCase();
            const correct = correctVal.toLowerCase();
            
            if (val === correct) return 1; 
            if (val.length === 0) return 0; 

            const dist = getEditDistance(val, correct);
            const threshold = correct.length < 5 ? 1 : 2;
            
            if (dist <= threshold) return 0.5; 
            return 0; 
        }

        function checkAnswers() {
            let totalScore = 0;
            
            quizData.forEach(item => {
                const stateInput = document.getElementById(`input-state-${item.id}`);
                const capInput = document.getElementById(`input-cap-${item.id}`);
                const card = document.getElementById(`card-${item.id}`);
                const statePath = d3.select(`#state-${item.id}`);

                const statePoints = gradeInput(stateInput.value, item.name);
                const capPoints = gradeInput(capInput.value, item.capital);

                stateInput.className = statePoints === 1 ? 'correct' : (statePoints === 0.5 ? 'partial' : 'incorrect');
                capInput.className = capPoints === 1 ? 'correct' : (capPoints === 0.5 ? 'partial' : 'incorrect');

                const itemTotal = statePoints + capPoints;
                statePath.classed("correct", false).classed("partial", false).classed("incorrect", false);
                
                if (itemTotal === 2) {
                    statePath.classed("correct", true);
                } else if (itemTotal > 0) {
                    statePath.classed("partial", true);
                    card.classList.add("show-key");
                } else {
                    statePath.classed("incorrect", true);
                    card.classList.add("show-key");
                }

                totalScore += itemTotal;
            });

            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.style.display = 'block';
            scoreDisplay.innerHTML = `Final Score: <span style="color:${totalScore >= 90 ? 'var(--success)' : 'var(--primary)'}">${totalScore} / 100</span>`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            alert(`You scored ${totalScore} out of 100!\n\nGreen boxes = 1 point\nYellow boxes = 0.5 points (typo)\nRed boxes = 0 points`);
        }

        init();
    </script>
</body>
</html>
