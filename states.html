<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US States & Capitals Quiz</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson@3"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --error: #ef4444;
            --bg: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg);
            /* Better touch handling for iPad */
            touch-action: manipulation; 
        }

        h1 { text-align: center; color: #1e293b; margin-bottom: 5px; }
        
        /* Map Container - Locked Aspect Ratio */
        #map-container {
            width: 100%;
            position: relative;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 30px;
            border: 2px solid #e2e8f0;
            overflow: hidden;
        }

        /* Responsive SVG logic */
        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .state {
            fill: #e2e8f0;
            stroke: white;
            stroke-width: 1px;
            stroke-linejoin: round;
            transition: fill 0.2s;
        }

        /* Active state (when input is focused) */
        .state.active { 
            fill: var(--primary); 
            stroke: #1e40af;
        }
        
        .state.correct { fill: var(--success); }
        .state.incorrect { fill: var(--error); }

        .state-label {
            font-size: 12px;
            font-weight: 700;
            fill: #334155;
            pointer-events: none;
            text-anchor: middle;
            alignment-baseline: middle;
            font-family: sans-serif;
            text-shadow: 
                -1px -1px 0 #fff,  
                 1px -1px 0 #fff,
                -1px  1px 0 #fff,
                 1px  1px 0 #fff;
        }
        
        .state-label.active { fill: white; text-shadow: none; }

        /* Quiz Form */
        #quiz-form {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .question-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-card:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .number-badge {
            background: #1e293b;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .inputs {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        input {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            width: 100%;
            font-size: 16px; /* Prevents zoom on iPad input focus */
            -webkit-appearance: none; /* Removes iPad internal styling */
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input.correct { border-color: var(--success); background-color: #f0fdf4; }
        input.incorrect { border-color: var(--error); background-color: #fef2f2; }

        .answer-key {
            font-size: 12px;
            color: var(--error);
            display: none;
            margin-top: 4px;
        }
        .show-key .answer-key { display: block; }

        #controls {
            text-align: center;
            margin: 40px 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover { background-color: #1d4ed8; }
        button#reset { background-color: #64748b; }

    </style>
</head>
<body>

    <h1>🇺🇸 50 States & Capitals</h1>
    <p style="text-align: center; color: #64748b; margin-bottom: 20px;">
        Tap a box below to find the state on the map!
    </p>

    <div id="map-container"></div>

    <div id="quiz-form"></div>

    <div id="controls">
        <button onclick="checkAnswers()">Check Answers</button>
        <button id="reset" onclick="location.reload()">New Quiz</button>
    </div>

    <script>
        // Data matching State Names to Official Map IDs (FIPS codes)
        const statesData = [
            { id: "01", name: "Alabama", capital: "Montgomery" },
            { id: "02", name: "Alaska", capital: "Juneau" },
            { id: "04", name: "Arizona", capital: "Phoenix" },
            { id: "05", name: "Arkansas", capital: "Little Rock" },
            { id: "06", name: "California", capital: "Sacramento" },
            { id: "08", name: "Colorado", capital: "Denver" },
            { id: "09", name: "Connecticut", capital: "Hartford" },
            { id: "10", name: "Delaware", capital: "Dover" },
            { id: "12", name: "Florida", capital: "Tallahassee" },
            { id: "13", name: "Georgia", capital: "Atlanta" },
            { id: "15", name: "Hawaii", capital: "Honolulu" },
            { id: "16", name: "Idaho", capital: "Boise" },
            { id: "17", name: "Illinois", capital: "Springfield" },
            { id: "18", name: "Indiana", capital: "Indianapolis" },
            { id: "19", name: "Iowa", capital: "Des Moines" },
            { id: "20", name: "Kansas", capital: "Topeka" },
            { id: "21", name: "Kentucky", capital: "Frankfort" },
            { id: "22", name: "Louisiana", capital: "Baton Rouge" },
            { id: "23", name: "Maine", capital: "Augusta" },
            { id: "24", name: "Maryland", capital: "Annapolis" },
            { id: "25", name: "Massachusetts", capital: "Boston" },
            { id: "26", name: "Michigan", capital: "Lansing" },
            { id: "27", name: "Minnesota", capital: "Saint Paul" },
            { id: "28", name: "Mississippi", capital: "Jackson" },
            { id: "29", name: "Missouri", capital: "Jefferson City" },
            { id: "30", name: "Montana", capital: "Helena" },
            { id: "31", name: "Nebraska", capital: "Lincoln" },
            { id: "32", name: "Nevada", capital: "Carson City" },
            { id: "33", name: "New Hampshire", capital: "Concord" },
            { id: "34", name: "New Jersey", capital: "Trenton" },
            { id: "35", name: "New Mexico", capital: "Santa Fe" },
            { id: "36", name: "New York", capital: "Albany" },
            { id: "37", name: "North Carolina", capital: "Raleigh" },
            { id: "38", name: "North Dakota", capital: "Bismarck" },
            { id: "39", name: "Ohio", capital: "Columbus" },
            { id: "40", name: "Oklahoma", capital: "Oklahoma City" },
            { id: "41", name: "Oregon", capital: "Salem" },
            { id: "42", name: "Pennsylvania", capital: "Harrisburg" },
            { id: "44", name: "Rhode Island", capital: "Providence" },
            { id: "45", name: "South Carolina", capital: "Columbia" },
            { id: "46", name: "South Dakota", capital: "Pierre" },
            { id: "47", name: "Tennessee", capital: "Nashville" },
            { id: "48", name: "Texas", capital: "Austin" },
            { id: "49", name: "Utah", capital: "Salt Lake City" },
            { id: "50", name: "Vermont", capital: "Montpelier" },
            { id: "51", name: "Virginia", capital: "Richmond" },
            { id: "53", name: "Washington", capital: "Olympia" },
            { id: "54", name: "West Virginia", capital: "Charleston" },
            { id: "55", name: "Wisconsin", capital: "Madison" },
            { id: "56", name: "Wyoming", capital: "Cheyenne" }
        ];

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let quizData = [];

        async function init() {
            // 1. Setup Quiz Data
            const shuffledStates = shuffle([...statesData]);
            
            quizData = shuffledStates.map((state, index) => ({
                ...state,
                quizNumber: index + 1
            }));

            // 2. Render Forms (Input Side)
            const formContainer = document.getElementById('quiz-form');
            quizData.sort((a,b) => a.quizNumber - b.quizNumber).forEach(item => {
                const div = document.createElement('div');
                div.className = 'question-card';
                div.id = `card-${item.id}`;
                div.innerHTML = `
                    <div class="number-badge">${item.quizNumber}</div>
                    <div class="inputs">
                        <input type="text" placeholder="State" id="input-state-${item.id}" onfocus="highlightState('${item.id}')">
                        <input type="text" placeholder="Capital" id="input-cap-${item.id}" onfocus="highlightState('${item.id}')">
                        <div class="answer-key">Correct: <b>${item.name}</b>, <b>${item.capital}</b></div>
                    </div>
                `;
                formContainer.appendChild(div);
            });

            // 3. Render Map
            // We use the standard 975x610 viewbox for Albers USA
            const svg = d3.select("#map-container").append("svg")
                .attr("viewBox", "0 0 975 610")
                .attr("preserveAspectRatio", "xMidYMid meet");

            try {
                // Fetch the Standard US TopoJSON Atlas (High reliability)
                const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
                
                // Define the path generator
                const path = d3.geoPath(); 

                const g = svg.append("g");

                // Draw States
                g.selectAll("path")
                    .data(topojson.feature(us, us.objects.states).features)
                    .enter().append("path")
                    .attr("d", path)
                    .attr("class", "state")
                    .attr("id", d => `state-${d.id}`);

                // Add Numbers
                g.selectAll("text")
                    .data(topojson.feature(us, us.objects.states).features)
                    .enter().append("text")
                    .attr("class", "state-label")
                    .attr("transform", d => {
                        const centroid = path.centroid(d);
                        // Filter out empty paths
                        if (!centroid[0]) return "translate(-100,-100)"; 
                        
                        // Adjustments for small states to prevent overlapping
                        let [x, y] = centroid;
                        // Manual tweaks for crowded East Coast
                        if (d.id === "10") { x += 15; y += 5; } // Delaware
                        if (d.id === "44") { x += 10; y += 10; } // Rhode Island
                        if (d.id === "11") { y += 5; } // DC
                        
                        return `translate(${x},${y})`;
                    })
                    .attr("id", d => `label-${d.id}`)
                    .text(d => {
                        const match = quizData.find(q => q.id === d.id);
                        return match ? match.quizNumber : "";
                    });

            } catch (error) {
                document.getElementById('map-container').innerHTML = `
                    <div style="padding:40px; text-align:center; color:#ef4444;">
                        <h3>⚠️ Map Loading Error</h3>
                        <p>Please check your internet connection and refresh.</p>
                        <p style="font-size:12px; color:#64748b;">${error.message}</p>
                    </div>`;
            }
        }

        // Interaction: Input -> Map
        function highlightState(id) {
            // Clear previous
            d3.selectAll(".state").classed("active", false);
            d3.selectAll(".state-label").classed("active", false);

            // Activate new
            d3.select(`#state-${id}`).classed("active", true);
            d3.select(`#label-${id}`).classed("active", true);
        }

        // Validation
        function checkAnswers() {
            let score = 0;
            
            quizData.forEach(item => {
                const stateInput = document.getElementById(`input-state-${item.id}`);
                const capInput = document.getElementById(`input-cap-${item.id}`);
                const card = document.getElementById(`card-${item.id}`);
                const statePath = d3.select(`#state-${item.id}`);

                if(!stateInput) return; 

                const stateCorrect = stateInput.value.trim().toLowerCase() === item.name.toLowerCase();
                const capCorrect = capInput.value.trim().toLowerCase() === item.capital.toLowerCase();

                // Style Inputs
                stateInput.className = stateCorrect ? 'correct' : 'incorrect';
                capInput.className = capCorrect ? 'correct' : 'incorrect';

                // Style Map & Score
                if (stateCorrect && capCorrect) {
                    statePath.classed("correct", true).classed("incorrect", false);
                    score++;
                } else {
                    statePath.classed("incorrect", true).classed("correct", false);
                    card.classList.add("show-key");
                }
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
            alert(`You got ${score} out of 50 correct!`);
        }

        init();
    </script>
</body>
</html>
